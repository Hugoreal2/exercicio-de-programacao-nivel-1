<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Quiz de Python</title>
  <meta name="description" content="Quiz de escolha múltipla sobre as bases de Python." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Ecrã inicial -->
    <section id="ecra-inicio" class="ecra ativo">
      <div class="centro">
        <div class="emblema">🐍</div>
        <h1 id="titulo">Quiz de Python</h1>
        <p id="subtitulo" class="sub"></p>
        <ul class="pontos">
          <li><span id="total-perguntas"></span> perguntas de escolha múltipla</li>
          <li>Explicação depois de cada resposta</li>
          <li>Opções embaralhadas em cada jogo</li>
        </ul>
      </div>
      <div class="acoes">
        <button class="btn" id="btn-comecar">Começar</button>
      </div>
    </section>

    <!-- Ecrã do quiz -->
    <section id="ecra-quiz" class="ecra">
      <header class="topo">
        <div class="topo-linha">
          <span class="contador" id="contador"></span>
          <span class="placar" id="placar"></span>
        </div>
        <div class="barra"><div class="barra-fill" id="barra-fill"></div></div>
      </header>

      <div class="conteudo">
        <h2 class="pergunta" id="pergunta"></h2>
        <pre class="codigo" id="codigo" hidden><code></code></pre>
        <div class="opcoes" id="opcoes"></div>
        <div class="explicacao" id="explicacao" hidden>
          <strong id="explicacao-titulo"></strong>
          <p id="explicacao-texto"></p>
        </div>
      </div>

      <div class="acoes">
        <button class="btn" id="btn-seguinte" hidden>Seguinte</button>
      </div>
    </section>

    <!-- Ecrã final -->
    <section id="ecra-fim" class="ecra">
      <div class="conteudo">
        <div class="resultado">
          <div class="anel" id="anel">
            <span class="anel-valor" id="pontuacao"></span>
          </div>
          <h2 id="resultado-titulo"></h2>
          <p class="sub" id="resultado-texto"></p>
        </div>
        <h3 class="secao-titulo">Revisão</h3>
        <ul class="revisao" id="revisao"></ul>
      </div>
      <div class="acoes">
        <button class="btn" id="btn-repetir">Jogar outra vez</button>
      </div>
    </section>

  </div>

  <script src="perguntas.js"></script>
  <script src="script.js"></script>
</body>
</html>
